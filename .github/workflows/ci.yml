name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  package-ci:
    uses: alextheman231/github-actions/.github/workflows/package-ci.yml@2e6f55a35af0696b45f5fd2facf87164d4e64533 # v14.0.2
    with:
      node-version: 26

  actions-ci:
    uses: alextheman231/github-actions/.github/workflows/actions-ci.yml@2e6f55a35af0696b45f5fd2facf87164d4e64533 # v14.0.2

  end-to-end-ci:
    uses: alextheman231/github-actions/.github/workflows/end-to-end-node-package-ci.yml@2e6f55a35af0696b45f5fd2facf87164d4e64533 # v14.0.2
    with:
      node-version: 26
