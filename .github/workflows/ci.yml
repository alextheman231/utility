name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  package-ci:
    uses: alextheman231/github-actions/.github/workflows/package-ci.yml@77ec4714869dc7574206ff9142a156dd8d49b671 # v12.7.5
    with:
      node-version: 26

  actions-ci:
    uses: alextheman231/github-actions/.github/workflows/actions-ci.yml@77ec4714869dc7574206ff9142a156dd8d49b671 # v12.7.5

  end-to-end-ci:
    uses: alextheman231/github-actions/.github/workflows/end-to-end-node-package-ci.yml@77ec4714869dc7574206ff9142a156dd8d49b671 # v12.7.5
    with:
      node-version: 26
