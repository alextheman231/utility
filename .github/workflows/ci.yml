name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  package-ci:
    uses: alextheman231/github-actions/.github/workflows/package-ci.yml@f1ff1cf13a2143e1e04a55da4b1fd77c2adb9b78 # v14.0.0
    with:
      node-version: 26

  actions-ci:
    uses: alextheman231/github-actions/.github/workflows/actions-ci.yml@f1ff1cf13a2143e1e04a55da4b1fd77c2adb9b78 # v14.0.0

  end-to-end-ci:
    uses: alextheman231/github-actions/.github/workflows/end-to-end-node-package-ci.yml@f1ff1cf13a2143e1e04a55da4b1fd77c2adb9b78 # v14.0.0
    with:
      node-version: 26
