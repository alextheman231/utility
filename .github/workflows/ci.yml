name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  package-ci:
    uses: alextheman231/github-actions/.github/workflows/package-ci.yml@f4de8c89bafe8588eecfa2cfe5916232efc959c0 # v12.10.1
    with:
      node-version: 26

  actions-ci:
    uses: alextheman231/github-actions/.github/workflows/actions-ci.yml@f4de8c89bafe8588eecfa2cfe5916232efc959c0 # v12.10.1

  end-to-end-ci:
    uses: alextheman231/github-actions/.github/workflows/end-to-end-node-package-ci.yml@f4de8c89bafe8588eecfa2cfe5916232efc959c0 # v12.10.1
    with:
      node-version: 26
