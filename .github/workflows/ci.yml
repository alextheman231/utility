name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  package-ci:
    uses: alextheman231/github-actions/.github/workflows/package-ci.yml@c33cab51e66ede91cc06169f056ce75f59222ff5 # v14.2.0
    with:
      node-version: 26

  actions-ci:
    uses: alextheman231/github-actions/.github/workflows/actions-ci.yml@c33cab51e66ede91cc06169f056ce75f59222ff5 # v14.2.0

  end-to-end-ci:
    uses: alextheman231/github-actions/.github/workflows/end-to-end-node-package-ci.yml@c33cab51e66ede91cc06169f056ce75f59222ff5 # v14.2.0
    with:
      node-version: 26

  secret-scan-ci:
    permissions:
      contents: read
    uses: alextheman231/github-actions/.github/workflows/secret-scan-ci.yml@418c332315197ab9833fa7e2abf2bfb6475335d1 # v14.3.0
    with:
      github-push-before-sha: ${{ github.event.before }}
      github-push-base-sha: ${{ github.event.base_ref }}
      github-pull-base-sha: ${{ github.event.pull_request.base.sha }}
    secrets:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
